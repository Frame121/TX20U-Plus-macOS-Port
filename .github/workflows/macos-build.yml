name: Experimental macOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "driver/**"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: read

jobs:
  build-tahoe-intel:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --show-sdk-path
      - name: Fetch RTL8852A firmware
        working-directory: driver
        run: bash scripts/fetch-firmware.sh
      - name: Build RTL8852A daemon
        working-directory: driver/port
        run: |
          make clean
          make
      - name: Build experimental Airport kext
        working-directory: driver/airport
        run: bash build.sh
      - name: Build RTW89Hold kext
        working-directory: driver/kext
        run: bash build.sh
      - name: Verify artifacts
        run: |
          test -s driver/port/rtw89d
          test -s driver/airport/RTW89Airport.kext/Contents/Info.plist
          test -s driver/airport/RTW89Airport.kext/Contents/MacOS/RTW89Airport
          test -s driver/kext/RTW89Hold.kext/Contents/MacOS/RTW89Hold
          plutil -lint driver/airport/RTW89Airport.kext/Contents/Info.plist
          plutil -lint driver/kext/RTW89Hold.kext/Contents/Info.plist
          file driver/port/rtw89d
          file driver/airport/RTW89Airport.kext/Contents/MacOS/RTW89Airport
          file driver/kext/RTW89Hold.kext/Contents/MacOS/RTW89Hold
          lipo -info driver/port/rtw89d
          lipo -info driver/airport/RTW89Airport.kext/Contents/MacOS/RTW89Airport
          lipo -info driver/kext/RTW89Hold.kext/Contents/MacOS/RTW89Hold
          otool -L driver/port/rtw89d
      - name: Package compile-test bundle
        run: |
          mkdir -p dist/TX20U-Plus-macOS-compile-test
          cp driver/port/rtw89d dist/TX20U-Plus-macOS-compile-test/
          ditto driver/airport/RTW89Airport.kext dist/TX20U-Plus-macOS-compile-test/RTW89Airport.kext
          ditto driver/kext/RTW89Hold.kext dist/TX20U-Plus-macOS-compile-test/RTW89Hold.kext
          cp README.md PORTING_ASSESSMENT.md dist/TX20U-Plus-macOS-compile-test/
          cat > dist/TX20U-Plus-macOS-compile-test/TEST-ONLY.txt <<'EOF'
          COMPILE-TEST ONLY — NOT A WORKING WI-FI DRIVER.
          The Airport kext is milestone 0: it registers an IO80211 interface but
          returns unsupported for every request. Do not install into a production EFI.
          No physical TX20U Plus hardware test, Wi-Fi scan, association, DHCP or traffic
          test has been completed. The adapter target is RTL8852A/RTL8852AU (2357:013F).
          This bundle is x86_64 and was compiled on a macOS 26 Intel GitHub runner.
          EOF
          ditto -c -k --sequesterRsrc --keepParent dist/TX20U-Plus-macOS-compile-test dist/TX20U-Plus-macOS-compile-test.zip
          shasum -a 256 dist/TX20U-Plus-macOS-compile-test.zip > dist/TX20U-Plus-macOS-compile-test.zip.sha256
      - name: Package RTL8852AU hardware test kit
        run: |
          mkdir -p dist/TX20U-Plus-RTL8852AU-test-kit/scripts dist/TX20U-Plus-RTL8852AU-test-kit/rtw89
          cp driver/port/rtw89d dist/TX20U-Plus-RTL8852AU-test-kit/
          cp driver/scripts/fetch-firmware.sh dist/TX20U-Plus-RTL8852AU-test-kit/scripts/
          cp driver/test/scan.sh dist/TX20U-Plus-RTL8852AU-test-kit/scripts/
          cp driver/test/README.md dist/TX20U-Plus-RTL8852AU-test-kit/README.md
          cat > dist/TX20U-Plus-RTL8852AU-test-kit/STATUS.txt <<'EOF'
          EXPERIMENTAL HARDWARE TEST ONLY.
          This kit contains the RTL8852A/RTL8852AU userspace backend and IOKit USB shim.
          It is not a signed installer or a completed native macOS Wi-Fi driver.
          The TX20U Plus has not yet been tested on macOS Tahoe.
          The Airport kext is not included because it is an unfinished milestone-0 stub.
          No EFI changes, SIP changes, or kext installation are required for the scan test.
          Firmware is downloaded on the test Mac from linux-firmware; see its licence.
          EOF
          chmod +x dist/TX20U-Plus-RTL8852AU-test-kit/scripts/*.sh
          file dist/TX20U-Plus-RTL8852AU-test-kit/rtw89d
          test -s dist/TX20U-Plus-RTL8852AU-test-kit/scripts/scan.sh
          ditto -c -k --sequesterRsrc --keepParent dist/TX20U-Plus-RTL8852AU-test-kit dist/TX20U-Plus-RTL8852AU-test-kit.zip
          shasum -a 256 dist/TX20U-Plus-RTL8852AU-test-kit.zip > dist/TX20U-Plus-RTL8852AU-test-kit.zip.sha256
      - name: Upload compile-test bundle
        uses: actions/upload-artifact@v4
        with:
          name: TX20U-Plus-macOS-compile-test
          path: |
            dist/TX20U-Plus-macOS-compile-test.zip
            dist/TX20U-Plus-macOS-compile-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload RTL8852AU hardware test kit
        uses: actions/upload-artifact@v4
        with:
          name: TX20U-Plus-RTL8852AU-test-kit
          path: |
            dist/TX20U-Plus-RTL8852AU-test-kit.zip
            dist/TX20U-Plus-RTL8852AU-test-kit.zip.sha256
          if-no-files-found: error
          retention-days: 14
